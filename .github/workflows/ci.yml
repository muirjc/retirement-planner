name: CI

# rp-apm: this project's first CI pipeline. Runs the same four test suites
# README.md's own Testing section documents, plus the quality/security gates
# modeled on /home/jmuir/projects/ADP's own drift-check.yml (ruff, mypy,
# bandit, pip-audit) and deploy-azure.yml (a DAST-style scan, here an OWASP
# ZAP API scan against services/bff's own OpenAPI spec instead of a
# container-image CVE scan, since this project has no Dockerfile yet).

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

jobs:
  quality-gates:
    name: Quality Gates (tests, lint, types, SAST, dependency audit)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      # Install order matters: services/bff declares retirement_planner as a
      # dependency but expects it already present as a sibling editable
      # install, never published anywhere (services/bff/pyproject.toml's own
      # comment) -- core must land first.
      - name: Install core library
        run: pip install -e ".[dev]"
      - name: Install BFF
        run: pip install -e "services/bff[dev]"
      - name: Install Streamlit UI
        run: pip install -e "apps/streamlit_ui[dev]"

      - name: Lint (ruff) -- core
        run: ruff check src/ tests/
      - name: Lint (ruff) -- BFF
        run: ruff check services/bff/
      - name: Lint (ruff) -- Streamlit UI
        run: ruff check apps/streamlit_ui/

      # rp-cgj: report-only until the 28-finding baseline (13 core / 4 BFF /
      # 11 UI) established when mypy was first added is triaged and fixed --
      # not blocking here to avoid either fixing untriaged type gaps in
      # tested, constitution-covered financial-calculation code as a side
      # effect of adding CI tooling, or shipping CI red on day one. Remove
      # continue-on-error per package once rp-cgj closes that package's own
      # findings.
      - name: Type check (mypy) -- core
        continue-on-error: true
        run: mypy --config-file pyproject.toml src/retirement_planner
      - name: Type check (mypy) -- BFF
        continue-on-error: true
        run: mypy --config-file services/bff/pyproject.toml services/bff/src/rp_bff
      - name: Type check (mypy) -- Streamlit UI
        continue-on-error: true
        run: mypy --config-file apps/streamlit_ui/pyproject.toml apps/streamlit_ui/src/rp_ui

      # -ll (medium+ severity only): the low-severity findings this baseline
      # already has (assert-used in worker-process code; random.Random used
      # for Monte Carlo sampling, never cryptography) are expected, reviewed
      # uses -- not bugs to gate on.
      - name: Security scan (bandit) -- core
        run: bandit -r src/retirement_planner -ll
      - name: Security scan (bandit) -- BFF
        run: bandit -r services/bff/src/rp_bff -ll
      - name: Security scan (bandit) -- Streamlit UI
        run: bandit -r apps/streamlit_ui/src/rp_ui -ll

      # One combined scan across all three packages' installed dependencies
      # (already all installed into this one job's environment) rather than
      # three separate calls -- pip-audit scans the live environment, not a
      # single package's own closure, so splitting it up would just repeat
      # the same shared transitive dependencies three times for no benefit.
      # --skip-editable: the three local packages themselves aren't on PyPI
      # and can't be audited.
      - name: Dependency CVE scan (pip-audit)
        run: pip-audit --skip-editable

      - name: Test -- core library
        run: pytest tests/
      - name: Test -- BFF
        run: pytest services/bff/tests/
      - name: Test -- Streamlit UI
        run: pytest apps/streamlit_ui/tests/

  e2e-tests:
    name: End-to-End Tests (Playwright)
    runs-on: ubuntu-latest
    needs: quality-gates

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install core library
        run: pip install -e ".[dev]"
      - name: Install BFF
        run: pip install -e "services/bff[dev]"
      - name: Install Streamlit UI
        run: pip install -e "apps/streamlit_ui[dev]"
      - name: Install e2e dependencies
        working-directory: e2e
        run: pip install -e ".[dev]"

      # --with-deps: a fresh GitHub-hosted runner has no Chromium shared
      # libraries preinstalled and this step has sudo, unlike a sandboxed
      # dev container -- pulls both the browser binary and its OS packages.
      - name: Install Playwright Chromium
        working-directory: e2e
        run: playwright install --with-deps chromium

      - name: Run e2e suite
        working-directory: e2e
        run: pytest -q

  zap-api-scan:
    name: ZAP API Security Scan (pen test)
    runs-on: ubuntu-latest
    needs: quality-gates
    # rp-apm: this job's mechanics (starting the BFF, hitting its
    # /openapi.json, invoking the ZAP container, parsing its report) were
    # written against and validated by ADP's own proven zap-api-scan job
    # (/home/jmuir/projects/ADP/.github/workflows/drift-check.yml) and by
    # confirming this BFF serves a real OpenAPI 3.1 spec with all 12 routes
    # -- but the actual `docker run zaproxy` invocation itself could NOT be
    # executed end-to-end in the sandboxed container this pipeline was
    # authored in (no working Docker daemon available there). Treat this
    # job's first few real runs as calibration: read the uploaded report,
    # confirm the scan actually completes and produces sensible findings,
    # and only then consider tightening continue-on-error below.
    continue-on-error: true

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install core library
        run: pip install -e ".[dev]"
      - name: Install BFF
        run: pip install -e "services/bff[dev]"

      - name: Start BFF (isolated scenarios dir)
        run: |
          mkdir -p /tmp/rp_zap_scenarios/config/scenarios
          cd /tmp/rp_zap_scenarios
          uvicorn rp_bff.main:app --host 127.0.0.1 --port 8000 &
          echo "Waiting for server to be ready..."
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8000/api/v1/reference/states && break
            sleep 2
          done
          curl -f http://127.0.0.1:8000/api/v1/reference/states

      - name: Pull ZAP Docker image
        run: docker pull ghcr.io/zaproxy/zaproxy:stable

      - name: Create ZAP report directory
        # World-writable so the ZAP container (runs as uid 1000) can write
        # the report into the mounted volume -- see ADP's own equivalent
        # step for the exact permission-denied failure this avoids.
        run: |
          mkdir -p zap-reports
          chmod 777 zap-reports

      - name: Run ZAP API scan
        run: |
          docker run --rm \
            --network host \
            -v "$(pwd)/zap-reports:/zap/wrk:rw" \
            -v "$(pwd)/.zap:/zap/rules:ro" \
            ghcr.io/zaproxy/zaproxy:stable \
            zap-api-scan.py \
              -t http://127.0.0.1:8000/openapi.json \
              -f openapi \
              -r zap-report.html \
              -J zap-report.json \
              -c /zap/rules/rules.tsv \
              -I \
              2>&1 | tee zap-output.txt
          ZAP_EXIT=${PIPESTATUS[0]}
          echo "ZAP exit code: $ZAP_EXIT"
          # zap-api-scan.py exit codes: 0 = clean, 2 = warnings only (pass,
          # via -I). 1 = FAIL-threshold alert(s); 3 = scan could not
          # complete. Both are failures.
          if [ "$ZAP_EXIT" -eq 1 ] || [ "$ZAP_EXIT" -eq 3 ]; then
            echo "::error::ZAP found FAIL-threshold issues or could not complete -- see zap-report.html"
            exit 1
          fi

      - name: Upload ZAP reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zap-security-report-${{ github.run_id }}
          path: |
            zap-reports/zap-report.html
            zap-reports/zap-report.json
            zap-output.txt
          retention-days: 30
