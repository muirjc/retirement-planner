[project]
name = "rp-ui"
version = "0.1.0"
description = "Streamlit UI for the retirement_planner program -- scenario management, simulation runs, comparisons, and CSV export. Talks to services/bff (007) exclusively over HTTP. See specs/008-streamlit-ui/."
requires-python = ">=3.11"
dependencies = [
    # Deliberately NOT retirement_planner or rp_bff -- this package talks
    # to 007 over HTTP only, never by import (research.md §1). That
    # omission is structural: apps/streamlit_ui/pyproject.toml never lists
    # either as a dependency, enforced by test_dependency_containment.py.
    "streamlit>=1.38",
    "httpx>=0.27",
    "plotly>=5.22",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    # rp-apm: CI quality gates -- see ../../pyproject.toml's own comment
    # on these same four pins.
    "ruff==0.15.20",
    "mypy==2.1.0",
    "bandit==1.9.4",
    "pip-audit==2.10.1",
]

[build-system]
requires = ["setuptools>=83.0.0"]  # PYSEC-2026-3447 fix floor, see root pyproject.toml
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

# -- Ruff / Mypy (rp-apm) -- see ../../pyproject.toml's own comments for why
# these settings (line-length, dropped "I" select, non-strict mypy).

[tool.ruff]
line-length = 190
src = ["src"]

[tool.ruff.lint]
select = ["E", "W", "F"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
disallow_untyped_defs = false
check_untyped_defs = true
warn_unused_ignores = false
warn_return_any = false
no_implicit_reexport = false
