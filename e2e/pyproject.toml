[project]
name = "rp-e2e"
version = "0.1.0"
description = "Full-stack, browser-driven end-to-end tests for the Retirement Planner: launches a real services/bff (uvicorn) + apps/streamlit_ui (streamlit run) pair, isolated from config/scenarios/, and drives the UI through a real Chromium browser via Playwright. See README.md."
requires-python = ">=3.11"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-playwright>=0.5",
    "pytest-rerunfailures>=14",
    "httpx>=0.27",
]

[build-system]
requires = ["setuptools>=83.0.0"]  # PYSEC-2026-3447 fix floor, see root pyproject.toml
build-backend = "setuptools.build_meta"

[tool.setuptools]
# rp-xwm: this "package" has no importable code of its own -- conftest.py,
# helpers.py, and test_*.py sit flat here and are discovered/run by pytest
# directly (testpaths = ["."] below), never imported by name from outside
# this directory. Without this, setuptools' default auto-discovery sees
# multiple flat top-level modules (helpers, test_scenarios_page, ...) and
# refuses to guess which one(s) to package, failing
# `pip install -e ".[dev]"` outright ("Multiple top-level modules
# discovered in a flat-layout"). py-modules = [] tells it explicitly:
# there's nothing to package here, only dependencies (dev, above) to
# install -- sidesteps the ambiguity instead of resolving it.
py-modules = []

[tool.pytest.ini_options]
testpaths = ["."]
# A real Streamlit rerun's own frontend paint can trail its
# stStatusWidget "finished" signal by an unpredictable amount under
# sustained load (helpers.py's own wait_for_results() docstring) --
# genuine timing flakiness in a real browser against a real server under
# this suite's own full ~16-test run, not a flaky assertion about
# behavior: every failure reproduces as a pass in isolation. Several
# reruns with a short delay (Playwright's own test runner defaults to
# retrying for the same reason) absorbs that without masking an actual
# regression, which fails the same way on every attempt, retries or not.
addopts = "--reruns 3 --reruns-delay 3"
