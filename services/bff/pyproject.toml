[project]
name = "rp-bff"
version = "0.1.0"
description = "BFF (backend-for-frontend) HTTP/JSON API service wrapping the retirement_planner library. See specs/007-bff-api-service/."
requires-python = ">=3.11"
dependencies = [
    # retirement_planner is a sibling package in this monorepo, expected to
    # already be installed editable (`pip install -e .`) into the same
    # environment this package is installed into -- not published anywhere,
    # so no version pin or index-facing source is declared here (plan.md
    # Project Structure; research.md keeps the core package's own
    # pyproject.toml completely unaware of this package).
    "retirement_planner",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
