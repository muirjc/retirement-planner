[project]
name = "rp-bff"
version = "0.1.0"
description = "BFF (backend-for-frontend) HTTP/JSON API service wrapping the retirement_planner library. See specs/007-bff-api-service/."
requires-python = ">=3.11"
dependencies = [
    # retirement_planner is a sibling package in this monorepo, expected to
    # already be installed editable (`pip install -e .`) into the same
    # environment this package is installed into -- not published anywhere,
    # so no version pin or index-facing source is declared here (plan.md
    # Project Structure; research.md keeps the core package's own
    # pyproject.toml completely unaware of this package).
    "retirement_planner",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
    # rp-apm: CI quality gates -- see core pyproject.toml's own comment
    # on these same four pins.
    "ruff==0.15.20",
    "mypy==2.1.0",
    "bandit==1.9.4",
    "pip-audit==2.10.1",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

# -- Ruff / Mypy (rp-apm) -- see core pyproject.toml's own comments for why
# these settings (line-length, dropped "I" select, non-strict mypy).

[tool.ruff]
line-length = 190
src = ["src"]

[tool.ruff.lint]
select = ["E", "W", "F"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
disallow_untyped_defs = false
check_untyped_defs = true
warn_unused_ignores = false
warn_return_any = false
no_implicit_reexport = false
